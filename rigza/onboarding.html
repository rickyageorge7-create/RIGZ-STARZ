<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131226" />
    <title>Student profile — RIGZA</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="onboarding-page">
    <header class="simple-header"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">R</span><span><strong>RIGZA</strong><small>STARZ UNIVERSITY</small></span></a><button id="profile_sign_out" class="button quiet" type="button">Sign out</button></header>
    <main class="onboarding-layout">
      <section class="onboarding-intro"><p class="eyebrow">A good start</p><h1 id="profile_heading">Set up your student profile</h1><p class="muted">Add a few details so your schedule and campus tools can fit your student journey.</p><div class="step-indicator"><span>01</span><span>Student profile</span><i></i><span>02</span><span>Classes & campus</span></div></section>
      <section class="profile-card">
        <div id="profile_message" class="message" role="status" aria-live="polite" hidden></div>
        <form id="profile_form" class="form-stack">
          <div class="photo-row"><img id="profile_photo_preview" class="avatar-preview" alt="Profile photo preview" hidden /><label class="upload-control">Profile photo <span class="muted small">Optional · JPG, PNG, WebP · max 3 MB</span><input id="profile_photo" name="profile_photo" type="file" accept="image/jpeg,image/png,image/webp" /></label></div>
          <label>Full name<input id="profile_full_name" name="full_name" autocomplete="name" maxlength="100" required /></label>
          <label>Email address<input id="profile_email" name="email" type="email" autocomplete="email" readonly /></label>
          <label>School<input id="profile_school" name="school_name" autocomplete="organization" maxlength="140" required /></label>
          <label>Programme or major<input id="profile_programme" name="programme" autocomplete="organization-title" maxlength="140" placeholder="e.g. Information Technology" required /></label>
          <label>Academic level<select id="profile_level" name="academic_level" required><option value="">Choose your level</option><option>Freshman</option><option>Sophomore</option><option>Junior</option><option>Senior</option><option>Graduate</option><option>Other</option></select></label>
          <label>Phone number <span class="muted small">Optional</span><input id="profile_phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="32" placeholder="+231 …" /></label>
          <button id="profile_submit" class="button primary" type="submit">Continue to RIGZA</button>
        </form>
        <p class="privacy-note">Your profile photo is stored in a private bucket. You can change or remove it later.</p>
      </section>
    </main>
    <script type="module" src="js/onboarding.js"></script>
  </body>
</html>
